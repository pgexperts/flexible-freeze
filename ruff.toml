# Lint configuration for `ruff check` run from the repository root, in CI and
# locally.  Ruff's built-in default rule set is much wider than the one below
# (ruff 0.17.0 enables several hundred rules by default), so the set is named
# here rather than inherited.  When the pinned ruff in requirements-dev.txt is
# changed, check this list against its release notes.
#
# E4, E7, E9 and F are the errors ruff has always defaulted to.  E501 is not
# selected: lines are kept to 79 columns by convention, but `ruff check
# --select E501 --line-length 79 tests scripts` is not clean (487 findings),
# and the script's style debt is tracked in #44.  line-length is still set to
# 79 so that any formatter or E501 run uses the project's width.

line-length = 79
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
